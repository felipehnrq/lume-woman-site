
name: Preparar versão de teste

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Separar arquivos publicos da loja
        run: |
          mkdir -p site
          cp _headers app.js catalogo-supabase.js config.js entregas-publico.js index.html marca.css pagamentos.js pagamentos-publico.js styles.css tema-publico.js vitrine-v106.js site/
          cp -R admin assets politicas site/
          find site -type f -name .gitkeep -delete
          sed -i 's/modoTeste: false/modoTeste: true/' site/config.js
          grep -q 'modoTeste: true' site/config.js

      - name: Enviar versao sem publicar
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name lumewoman-teste --assets=./site --compatibility-date 2026-11-01