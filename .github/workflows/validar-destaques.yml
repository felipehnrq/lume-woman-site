name: Validar destaques sem publicar
on:
  push:
    branches: [feat/vitrine-quatro-destaques]
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'catalogo-supabase.js'
      - 'admin/**'
      - 'index.html'
      - 'tests/**'
      - 'migrations/2026-11-vitrine-destaques.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
