
name: Publicar Lume Woman em producao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serializa publicações sem interromper um envio já iniciado.
concurrency:
  group: cloudflare-lumewoman-producao
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium e dependências do sistema
        run: npx playwright install --with-deps chromium

      - name: Configurar caminho do Chromium
        run: node -e 'console.log("CHROMIUM_PATH=" + require("@playwright/test").chromium.executablePath())' >> "$GITHUB_ENV"

      - name: Executar testes Node.js e Playwright
        run: npm test

      - name: Preparar arquivos da loja
        run: |
          mkdir -p site
          cp _headers app.js catalogo-supabase.js config.js entregas-publico.js index.html marca.css pagamentos.js pagamentos-publico.js styles.css tema-publico.js vitrine-v106.js site/
          cp -R admin assets politicas site/
          find site -type f -name .gitkeep -delete
          sed -i 's/modoTeste: true/modoTeste: false/' site/config.js
          grep -q 'modoTeste: false' site/config.js
          # Liberar indexação exclusivamente em produção
          sed -i '/<meta name="robots" content="noindex,nofollow,noarchive"/d' site/index.html
          sed -i '/X-Robots-Tag: noindex, nofollow, noarchive/d' site/_headers
          cp robots.txt sitemap.xml site/
          ! grep -qi 'noindex' site/index.html site/_headers

          sed -i '/<div class="demo-alert">/d' site/index.html
          sed -i 's|<span class="footer-note">Ambiente de testes • Textos institucionais em revisão. Mensagens de pedido serão identificadas como teste.</span>||' site/index.html
          sed -i 's|<div class="hero-stamp" aria-hidden="true"><span>SEU</span><strong>estilo</strong><span>EM PRIMEIRO LUGAR</span></div>||' site/index.html
          sed -i 's|<p class="small-note"><strong>Modo de testes:</strong> a mensagem ao WhatsApp será identificada como TESTE e não deve ser tratada como pedido real.</p>||' site/index.html


      # Uma execução antiga pode sair da fila depois de uma mais recente.
      - name: Verificar se o commit ainda é o atual da main
        id: atual
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publicação ignorada: main já possui outro commit."
          fi

      - name: Publicar no Cloudflare
        if: steps.atual.outputs.publicar == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PROD_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name lumewoman --assets=./site --compatibility-date 2026-11-01
